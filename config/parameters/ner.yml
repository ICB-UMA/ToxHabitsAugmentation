ner:
  prompt: method_4_full_gen
  llm_model: gpt-41-nano
  data:
    raw_train: data/raw/train
    raw_test: data/raw/test
    augmented_root: data/corrected
    use_augmented: true
  augmented:
    suffix: _aug
  ner_model:
    base_model: PlanTL-GOB-ES/roberta-base-biomedical-clinical-es
    max_length: 256
  training:
    batch_size: 8
    learning_rate: 5e-5
    label_pad_id: -100
    epochs: 25
